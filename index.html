<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARTO MEMBER BOOK</title>

<style>
*{box-sizing:border-box}

:root{
  color-scheme:dark;
  --bg:#17151e;
  --text:#f5f2fa;
  --muted:#aaa5b6;
  --panel:#23212d;
  --panel2:#292735;
  --border:#454052;
  --bar-bg:#343140;
  --green:#10bd91;
  --green-bg:#103c35;
  --revealed-bg:#302b3a;
}

@media(prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#f6f5fa;
    --text:#272432;
    --muted:#777282;
    --panel:#ffffff;
    --panel2:#eeecf3;
    --border:#d8d4e1;
    --bar-bg:#e3e0e9;
    --green:#079b76;
    --green-bg:#d9f4eb;
    --revealed-bg:#e8e3ef;
  }
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans JP",sans-serif;
  transition:background .2s,color .2s;
}

main{max-width:1200px;margin:auto}
header{text-align:center;margin-bottom:25px}
h1{font-size:27px;letter-spacing:2px}
.subtitle{color:var(--muted);font-size:12px}

.progress-area{margin:20px 0}
.count{font-size:25px;font-weight:bold}
#count{color:var(--green)}
.bar{
  height:12px;background:var(--bar-bg);
  border-radius:20px;overflow:hidden;margin-top:10px
}
#bar{
  width:0;height:100%;
  background:var(--green);transition:.3s
}
#percent{text-align:right;color:var(--muted);font-size:13px;margin-top:5px}

.input-area{
  display:flex;gap:10px;margin:25px 0 15px
}
input{
  flex:1;min-width:0;padding:17px;
  background:var(--panel);border:2px solid var(--border);
  border-radius:13px;color:var(--text);font-size:17px
}
button{
  cursor:pointer;border:0;border-radius:13px;
  padding:13px 19px;font-weight:bold;font-size:15px
}
button:disabled{opacity:.5;cursor:not-allowed}

#add{background:#f04e38;color:white}
.controls{display:flex;flex-wrap:wrap;gap:9px}
.mode,.other{
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:30px
}
.mode.active{background:var(--border);border-color:#8d7ca9}

#message{margin:15px 0;min-height:25px;font-weight:bold}
.good{color:var(--green)}
.bad{color:#e66c62}
.description{font-size:13px;color:var(--muted);line-height:1.7}

.timer-area{
  margin:20px 0;
  padding:18px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--panel);
  text-align:center;
}
.timer-title{font-size:13px;color:var(--muted)}
#timer{
  font-size:35px;
  font-weight:bold;
  letter-spacing:2px;
  margin:8px 0;
  font-variant-numeric:tabular-nums;
}
#startAttack{background:#7655b5;color:white}
#stopAttack{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.timer-buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

.result{
  display:none;
  margin:20px 0;
  padding:22px;
  border-radius:17px;
  border:1px solid var(--green);
  background:var(--green-bg);
  color:var(--text);
  text-align:center;
}
.result.show{display:block}
.result h2{margin:0 0 12px;font-size:23px}
.result-time{font-size:36px;font-weight:bold;margin:10px 0}
.result-detail{font-size:14px;line-height:1.9}
.share-buttons{
  display:flex;justify-content:center;
  gap:10px;flex-wrap:wrap;margin-top:18px
}
.share-buttons button{color:white}
#shareX{background:#222}
#shareLine{background:#06C755}
#shareNative{background:#7655b5}

.group{margin-top:27px}
.group h2{
  font-size:16px;padding-bottom:9px;
  border-bottom:1px solid var(--border)
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px
}
.member{
  min-height:85px;background:var(--panel);
  border:1px dashed var(--border);border-radius:13px;
  padding:12px;display:flex;flex-direction:column;
  justify-content:space-between
}
.member .number{font-size:11px;color:var(--muted)}
.member .name{font-size:14px;font-weight:bold;overflow-wrap:anywhere}
.member .hidden{color:var(--muted);letter-spacing:3px}
.member.done{
  background:var(--green-bg);border:1px solid var(--green)
}
.member.done .number{color:var(--green)}
.member.revealed{background:var(--revealed-bg);border:1px solid #8d7ca9}

footer{
  text-align:center;color:var(--muted);
  margin:35px 0;font-size:12px;line-height:1.8
}

@media(max-width:650px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .input-area{flex-direction:column}
  #add{width:100%}
}
@media(max-width:380px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>
<main>

<header>
  <h1>STARTO MEMBER BOOK</h1>
  <div class="subtitle">MEMBER NAME CHALLENGE</div>
</header>

<div class="progress-area">
  <div class="count">
    <span id="count">0</span> /
    <span id="total">0</span> 正解
  </div>
  <div class="bar"><div id="bar"></div></div>
  <div id="percent">0%</div>
</div>

<form class="input-area" id="form">
  <input id="answer" placeholder="名前を入力（例：やまだたろう）" autocomplete="off">
  <button id="add" type="submit">追加する</button>
</form>

<div id="message"></div>

<div class="controls">
  <button class="mode active" id="kana">🌸 ひらがなOK</button>
  <button class="mode" id="kanji">🔥 漢字ピッタリ</button>
  <button class="other" id="reveal">答えを見る（ギブアップ）</button>
  <button class="other" id="reset">リセット</button>
</div>

<p class="description" id="description">
🌸 ひらがなOKモード：漢字・ひらがな・カタカナで正解。
スペルミスや一部だけの入力は不正解。
</p>

<!-- タイムアタック -->
<div class="timer-area">
  <div class="timer-title">⏱ TIME ATTACK</div>
  <div style="margin:12px 0;">
  <label for="timeLimit">制限時間：</label>
  <select id="timeLimit">
    <option value="180000">3分</option>
    <option value="300000" selected>5分</option>
  </select>
</div>
  <div id="timer">00:00.00</div>
  <div class="timer-buttons">
    <button id="startAttack">タイムアタック開始</button>
    <button id="stopAttack">途中で終了</button>
  </div>
  <p class="description">
    スタートを押すと計測開始！全員正解すると自動でタイマーが止まるよ。
  </p>
</div>

<!-- 結果表示 -->
<div class="result" id="result">
  <h2 id="resultTitle">🎉 ALL CLEAR!</h2>
  <div class="result-time" id="resultTime">00:00.00</div>
  <div class="result-detail" id="resultDetail"></div>
  <div class="share-buttons">
    <button id="shareX">𝕏 Xで共有</button>
    <button id="shareLine">LINEで共有</button>
    <button id="shareNative">共有メニュー</button>
  </div>
</div>

<div id="collection"></div>

<footer>
  STARTO MEMBER BOOK<br>
  メンバー名鑑（非公式サイト）<br>
  個人アーティスト（木村拓哉さんや上田竜也さんなど）は今回対象外です。<br>
  <span id="themeLabel">テーマ：端末の設定に連動</span>
</footer>

</main>

<script>
const groups = [
{
 name:"20th Century",
 members:[
 ["坂本昌行","さかもとまさゆき"],
 ["長野博","ながのひろし"],
 ["井ノ原快彦","いのはらよしひこ"]
 ]
},
{
 name:"NEWS",
 members:[
 ["小山慶一郎","こやまけいいちろう"],
 ["加藤シゲアキ","かとうしげあき"],
 ["増田貴久","ますだたかひさ"]
 ]
},
{
 name:"SUPER EIGHT",
 members:[
 ["横山裕","よこやまゆう"],
 ["村上信五","むらかみしんご"],
 ["丸山隆平","まるやまりゅうへい"],
 ["安田章大","やすだしょうた"],
 ["大倉忠義","おおくらただよし"]
 ]
},
{
 name:"Hey! Say! JUMP",
 members:[
 ["山田涼介","やまだりょうすけ"],
 ["知念侑李","ちねんゆうり"],
 ["有岡大貴","ありおかだいき"],
 ["髙木雄也","たかきゆうや"],
 ["伊野尾慧","いのおけい"],
 ["八乙女光","やおとめひかる"],
 ["薮宏太","やぶこうた"]
 ]
},
{
 name:"Kis-My-Ft2",
 members:[
 ["千賀健永","せんがけんと"],
 ["宮田俊哉","みやたとしや"],
 ["横尾渉","よこおわたる"],
 ["藤ヶ谷太輔","ふじがやたいすけ"],
 ["玉森裕太","たまもりゆうた"],
 ["二階堂高嗣","にかいどうたかし"]
 ]
},
{
 name:"timelesz",
 members:[
 ["佐藤勝利","さとうしょうり"],
 ["菊池風磨","きくちふうま"],
 ["松島聡","まつしまそう"],
 ["寺西拓人","てらにしたくと"],
 ["原嘉孝","はらよしたか"],
 ["橋本将生","はしもとまさき"],
 ["篠塚大輝","しのづかたいき"]
 ]
},
{
 name:"A.B.C-Z",
 members:[
 ["五関晃一","ごせきこういち"],
 ["塚田僚一","つかだりょういち"],
 ["戸塚祥太","とつかしょうた"],
 ["橋本良亮","はしもとりょうすけ"]
 ]
},
{
 name:"King & Prince",
 members:[
 ["永瀬廉","ながせれん"],
 ["髙橋海人","たかはしかいと"]
 ]
},
{
 name:"SixTONES",
 members:[
 ["ジェシー","じぇしー"],
 ["京本大我","きょうもとたいが"],
 ["松村北斗","まつむらほくと"],
 ["髙地優吾","こうちゆうご"],
 ["森本慎太郎","もりもとしんたろう"],
 ["田中樹","たなかじゅり"]
 ]
},
{
 name:"Snow Man",
 members:[
 ["岩本照","いわもとひかる"],
 ["深澤辰哉","ふかざわたつや"],
 ["ラウール","らうーる"],
 ["渡辺翔太","わたなべしょうた"],
 ["向井康二","むかいこうじ"],
 ["阿部亮平","あべりょうへい"],
 ["目黒蓮","めぐろれん"],
 ["宮舘涼太","みやだてりょうた"],
 ["佐久間大介","さくまだいすけ"]
 ]
},
{
 name:"なにわ男子",
 members:[
 ["西畑大吾","にしはただいご"],
 ["大西流星","おおにしりゅうせい"],
 ["道枝駿佑","みちえだしゅんすけ"],
 ["高橋恭平","たかはしきょうへい"],
 ["長尾謙杜","ながおけんと"],
 ["藤原丈一郎","ふじわらじょういちろう"],
 ["大橋和也","おおはしかずや"]
 ]
},
{
 name:"Travis Japan",
 members:[
 ["宮近海斗","みやちかかいと"],
 ["中村海人","なかむらかいと"],
 ["七五三掛龍也","しめかけりゅうや"],
 ["川島如恵留","かわしまのえる"],
 ["吉澤閑也","よしざわしずや"],
 ["松田元太","まつだげんた"],
 ["松倉海斗","まつくらかいと"]
 ]
},
{
 name:"Aぇ! group",
 members:[
 ["正門良規","まさかどよしのり"],
 ["末澤誠也","すえざわせいや"],
 ["小島健","こじまけん"],
 ["佐野晶哉","さのまさや"]
 ]
},
{
 name:"ふぉ～ゆ～",
 members:[
 ["福田悠太","ふくだゆうた"],
 ["辰巳雄大","たつみゆうだい"],
 ["越岡裕貴","こしおかゆうき"],
 ["松崎祐介","まつざきゆうすけ"]
 ]
},
{
 name:"KEY TO LIT",
 members:[
 ["岩﨑大昇","いわさきたいしょう"],
 ["井上瑞稀","いのうえみずき"],
 ["中村嶺亜","なかむられいあ"],
 ["猪狩蒼弥","いがりそうや"],
 ["佐々木大光","ささきたいこう"]
 ]
}
];

const members = groups.flatMap(g =>
 g.members.map(m => ({
   name:m[0],
   reading:m[1],
   group:g.name
 }))
);

let found = new Set(
 JSON.parse(localStorage.getItem("startoBook") || "[]")
);

let mode = "kana";
let reveal = false;

// タイムアタック用
let attackMode = false;
let attackFound = new Set();
let attackStart = 0;
let attackElapsed = 0;
let attackTimer = null;
let attackFinished = false;
let lastResultText = "";

const $ = id => document.getElementById(id);

$("total").textContent = members.length;

function normalize(s){
 return s.normalize("NFKC").replace(/[\s　]/g,"");
}

function toHiragana(s){
 return s.replace(/[ァ-ヶ]/g,
 c => String.fromCharCode(c.charCodeAt(0)-96));
}

function currentFound(){
 return attackMode ? attackFound : found;
}

function render(){
 const activeFound = currentFound();

 $("count").textContent = activeFound.size;

 const percent = Math.round(
  activeFound.size / members.length * 100
 );

 $("bar").style.width = percent + "%";
 $("percent").textContent = percent + "%";

 $("collection").innerHTML = "";

 let number = 0;

 groups.forEach(group => {
  const section = document.createElement("section");
  section.className = "group";

  const title = document.createElement("h2");
  title.textContent = group.name;
  section.appendChild(title);

  const grid = document.createElement("div");
  grid.className = "grid";

  group.members.forEach(m => {
   number++;

   const done = activeFound.has(m[0]);

   const tile = document.createElement("div");
   tile.className = "member" +
     (done ? " done" : reveal ? " revealed" : "");

   const no = document.createElement("span");
   no.className = "number";
   no.textContent = "No." + number;

   const name = document.createElement("span");
   name.className = done || reveal ? "name" : "hidden";
   name.textContent = done || reveal ? m[0] : "・・・・";

   tile.append(no,name);
   grid.appendChild(tile);
  });

  section.appendChild(grid);
  $("collection").appendChild(section);
 });

 localStorage.setItem(
  "startoBook",
  JSON.stringify([...found])
 );
}

function setMode(next){
 mode = next;

 $("kana").classList.toggle("active",mode==="kana");
 $("kanji").classList.toggle("active",mode==="kanji");

 $("description").textContent =
 mode==="kana"
 ? "🌸 ひらがなOKモード：漢字・ひらがな・カタカナで正解。スペルミスや一部だけの入力は不正解。"
 : "🔥 漢字ピッタリモード：正式な漢字氏名と完全一致した場合だけ正解。読みだけでは不正解。";
}

function answer(value){
 const input = normalize(value);

 if(!input){
  showMessage("名前を入力してね！",false);
  return;
 }

 if(attackFinished){
  showMessage("タイムアタックは終了しているよ。もう一度スタートしてね！",false);
  return;
 }

 const target = members.find(m => {
  if(mode==="kanji"){
   return normalize(m.name) === input;
  }

  return normalize(m.name) === input ||
         toHiragana(input) === m.reading;
 });

 if(!target){
  showMessage("不正解！もう一度確認してね。",false);
  return;
 }

 const activeFound = currentFound();

 if(activeFound.has(target.name)){
  showMessage("そのメンバーは登録済みだよ！",true);
  return;
 }

 activeFound.add(target.name);

 showMessage(
  "✓ 正解！ "+target.name+"（"+target.group+"）が埋まったよ！",
  true
 );

 render();

 if(activeFound.size === members.length){
  if(attackMode){
   finishAttack(true);
  }else{
   showMessage("🎉 全員正解！図鑑コンプリート！！",true);
   showResult("🎉 ALL CLEAR!", "通常モードで全問正解！");
  }
 }

 $("answer").value = "";
}

function showMessage(text,good){
 $("message").textContent = text;
 $("message").className = good ? "good" : "bad";
}

function formatTime(ms){
 const minutes = Math.floor(ms / 60000);
 const seconds = Math.floor((ms % 60000) / 1000);
 const centiseconds = Math.floor((ms % 1000) / 10);

 return String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0") + "." +
        String(centiseconds).padStart(2,"0");
}

function updateTimer(){
 const elapsed = Date.now() - attackStart;
 $("timer").textContent = formatTime(elapsed);
}

function startAttack(){
 if(attackTimer) clearInterval(attackTimer);

 attackMode = true;
 attackFinished = false;
 attackFound = new Set();
 reveal = false;

 $("result").classList.remove("show");
 $("reveal").textContent = "答えを見る（ギブアップ）";
 $("answer").disabled = false;
 $("add").disabled = false;
 $("startAttack").textContent = "もう一度スタート";

 attackStart = Date.now();
 attackElapsed = 0;

 updateTimer();
 attackTimer = setInterval(updateTimer,50);

 showMessage("タイムアタック開始！全員の名前を入力しよう！",true);
 render();
 $("answer").focus();
}

function finishAttack(clear){
 if(!attackMode || attackFinished) return;

 attackFinished = true;
 attackElapsed = Date.now() - attackStart;

 if(attackTimer){
  clearInterval(attackTimer);
  attackTimer = null;
 }

 $("timer").textContent = formatTime(attackElapsed);
 $("answer").disabled = true;
 $("add").disabled = true;

 if(clear){
  showMessage("🎉 全問正解！タイムアタッククリア！！",true);
  showResult("🎉 TIME ATTACK CLEAR!", "全員正解！");
 }else{
  showMessage("タイムアタック終了！おつかれさまでした！",true);
  showResult("⏱ TIME ATTACK RESULT", "途中終了");
 }
}

function showResult(title,description){
 const count = currentFound().size;
 const percent = Math.round(count / members.length * 100);

 $("resultTitle").textContent = title;

 if(attackMode){
  $("resultTime").textContent = formatTime(attackElapsed);
 }else{
  $("resultTime").textContent = "100%";
 }

 $("resultDetail").textContent =
  description + "　正解数：" + count + " / " +
  members.length + "　達成率：" + percent + "%";

 lastResultText =
  "STARTO MEMBER BOOK\n" +
  description + "\n" +
  "正解数：" + count + " / " + members.length + "\n" +
  "達成率：" + percent + "%\n" +
  (attackMode ? "タイム：" + formatTime(attackElapsed) + "\n" : "") +
  location.href;

 $("result").classList.add("show");
}

function shareX(){
 const url = "https://twitter.com/intent/tweet?text=" +
  encodeURIComponent(lastResultText);

 window.open(url,"_blank","noopener");
}

function shareLine(){
 const url = "https://line.me/R/share?text=" +
  encodeURIComponent(lastResultText);

 window.open(url,"_blank","noopener");
}

async function shareNative(){
 if(navigator.share){
  try{
   await navigator.share({
    title:"STARTO MEMBER BOOK",
    text:lastResultText
   });
  }catch(e){}
 }else{
  copyResult();
 }
}

async function copyResult(){
 try{
  await navigator.clipboard.writeText(lastResultText);
  showMessage("共有用の結果をコピーしたよ！",true);
 }catch(e){
  showMessage("コピーできなかった場合は、XかLINEのボタンを使ってね。",false);
 }
}

$("form").addEventListener("submit",e=>{
 e.preventDefault();
 answer($("answer").value);
});

$("kana").onclick = ()=>setMode("kana");
$("kanji").onclick = ()=>setMode("kanji");

$("reveal").onclick = ()=>{
 if(attackMode && !attackFinished){
  finishAttack(false);
 }

 reveal = !reveal;
 $("reveal").textContent =
  reveal ? "答えを隠す" : "答えを見る（ギブアップ）";
 render();
};

$("reset").onclick = ()=>{
 if(!confirm("進捗をリセットしますか？")) return;

 if(attackTimer){
  clearInterval(attackTimer);
  attackTimer = null;
 }

 found.clear();
 attackFound.clear();
 attackMode = false;
 attackFinished = false;
 reveal = false;

 $("timer").textContent = "00:00.00";
 $("answer").disabled = false;
 $("add").disabled = false;
 $("result").classList.remove("show");
 $("reveal").textContent = "答えを見る（ギブアップ）";
 $("startAttack").textContent = "タイムアタック開始";

 showMessage("リセットしました。",true);
 render();
};

$("startAttack").onclick = startAttack;
$("stopAttack").onclick = ()=>{
 if(attackMode && !attackFinished){
  finishAttack(false);
 }else{
  showMessage("タイムアタック中ではないよ！",false);
 }
};

$("shareX").onclick = shareX;
$("shareLine").onclick = shareLine;
$("shareNative").onclick = shareNative;

// 端末のダーク／ライト設定に連動
const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");

function updateThemeLabel(){
 $("themeLabel").textContent =
  colorScheme.matches
  ? "テーマ：ダークモード"
  : "テーマ：ライトモード";
}

updateThemeLabel();

if(colorScheme.addEventListener){
 colorScheme.addEventListener("change",updateThemeLabel);
}else if(colorScheme.addListener){
 colorScheme.addListener(updateThemeLabel);
}

render();
</script>
</body>
</html>
